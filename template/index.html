<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoundAItion – Shade Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-start: #f6f9ff;
      --bg-end: #e7f5fa;
      --bg-accent: #ffeef4; 
      
      --text-dark: #0b2545;
      --text-light: #4a658a;
      --primary: #0077b6;
      --border-color: #dbe9f5;
      --card-shadow: 0 10px 30px -5px rgba(0, 119, 182, 0.1);
      --button-shadow: 0 4px 15px rgba(230, 93, 93, 0.3);
      --accent-grad-start: #e65c5c;
      --accent-grad-end: #d94a4a;
    }

    body {
      background: linear-gradient(135deg, 
        var(--bg-start), 
        var(--bg-end), 
        var(--bg-accent), 
        var(--bg-end)
      );
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center; 
      position: relative; 
      overflow-x: hidden;
    }
    
    #particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: floatUp 15s linear infinite;
      z-index: 0;
    }
    
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0.7; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
    
    .particle:nth-child(1) { left: 10%; width: 10px; height: 10px; animation-duration: 12s; animation-delay: 0s; }
    .particle:nth-child(2) { left: 20%; width: 20px; height: 20px; animation-duration: 15s; animation-delay: 2s; }
    .particle:nth-child(3) { left: 30%; width: 15px; height: 15px; animation-duration: 10s; animation-delay: 4s; }
    .particle:nth-child(4) { left: 40%; width: 12px; height: 12px; animation-duration: 18s; animation-delay: 1s; }
    .particle:nth-child(5) { left: 50%; width: 25px; height: 25px; animation-duration: 14s; animation-delay: 5s; }
    .particle:nth-child(6) { left: 60%; width: 10px; height: 10px; animation-duration: 16s; animation-delay: 3s; }
    .particle:nth-child(7) { left: 70%; width: 18px; height: 18px; animation-duration: 11s; animation-delay: 6s; }
    .particle:nth-child(8) { left: 80%; width: 22px; height: 22px; animation-duration: 13s; animation-delay: 8s; }
    .particle:nth-child(9) { left: 90%; width: 13px; height: 13px; animation-duration: 17s; animation-delay: 1s; }
    .particle:nth-child(10) { left: 15%; width: 16px; height: 16px; animation-duration: 14s; animation-delay: 7s; }
    .particle:nth-child(11) { left: 25%; width: 19px; height: 19px; animation-duration: 12s; animation-delay: 9s; }
    .particle:nth-child(12) { left: 35%; width: 24px; height: 24px; animation-duration: 16s; animation-delay: 2s; }
    .particle:nth-child(13) { left: 45%; width: 14px; height: 14px; animation-duration: 10s; animation-delay: 0s; }
    .particle:nth-child(14) { left: 55%; width: 11px; height: 11px; animation-duration: 19s; animation-delay: 4s; }
    .particle:nth-child(15) { left: 65%; width: 21px; height: 21px; animation-duration: 15s; animation-delay: 6s; }


    header {
      text-align: center;
      margin-bottom: 20px;
      position: relative; z-index: 1; 
    }

    h1 {
      font-size: 2.5rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-top: -10px;
      margin-bottom: 20px;
    }

    #facePalette {
      width: 200px;
      border-radius: 12px;
      border: 4px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    #mainContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      position: relative; z-index: 1; 
    }

    #videoFeed {
      width: 100%;
      height: auto;
      border-radius: 20px;
      border: 5px solid white;
      box-shadow: var(--card-shadow);
      background-color: #eee;
      aspect-ratio: 4 / 3;
    }

    #detectBtn {
      margin-top: 30px;
      background-image: linear-gradient(100deg, var(--accent-grad-start), var(--accent-grad-end));
      border: none;
      color: white;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 16px 40px;
      border-radius: 100px; 
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--button-shadow);
      letter-spacing: 0.5px;
    }

    #detectBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(230, 93, 93, 0.35);
    }

    #detectBtn:active {
      transform: translateY(-1px);
    }

    #resultCard {
      margin-top: 40px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      box-shadow: var(--card-shadow);
      text-align: center;
      transition: all 0.4s ease;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
    }

    #brandName {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 5px;
      line-height: 1.3;
    }
    
    #shadeName {
      font-size: 1.25rem;
      color: var(--text-light);
      margin-top: 0;
      margin-bottom: 15px;
      font-weight: 500;
    }
    
    #shadeValues {
      font-size: 0.95rem;
      color: var(--text-light);
      word-break: break-all;
      margin-top: 20px;
    }

    #swatchDisplay {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 25px;
    }

    #shadePalette {
      display: none;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100px; 
      height: 100px;
    }

    #productSwatch {
        display: none;
        border-radius: 12px;
        border: 2px solid var(--border-color);
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        width: 100px; 
        height: 100px;
        object-fit: cover; 
    }

    footer {
      margin-top: 50px;
      color: var(--text-light);
      font-size: 0.9rem;
      padding-bottom: 20px;
      text-align: center;
      position: relative; z-index: 1; 
    }

    @media (max-width: 600px) {
      body { padding: 15px; }
      h1 { font-size: 2rem; }
      #resultCard { padding: 20px; }
      #brandName { font-size: 1.5rem; }
      #shadeName { font-size: 1.1rem; }
      #detectBtn { width: 100%; padding: 16px; }
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

  </style>
</head>

<body>
  <div id="particle-container">
    <div class="particle"></div> <div class="particle"></div>
    <div class="particle"></div> <div class="particle"></div>
    <div class="particle"></div> <div class="particle"></div>
    <div class="particle"></div> <div class="particle"></div>
    <div class="particle"></div> <div class="particle"></div>
    <div class="particle"></div> <div class="particle"></div>
    <div class="particle"></div> <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <header>
    <h1>FoundAItion</h1>
    <p>Your perfect shade is just a click away.</p>
    <img src="/static/saved_palette.png" id="facePalette" alt="Your Face Palette" 
         onerror="this.style.display='none'">
  </header>

  <div id="mainContainer">
    <img src="{{ url_for('video_feed') }}" id="videoFeed" alt="Live Camera Feed">
    <button id="detectBtn">✨ Find My Match</button>

    <div id="resultCard">
      <div id="brandName">No match detected yet</div>
      <div id="shadeName"></div>

      <div id="swatchDisplay">
          <img id="shadePalette" alt="Matched Shade Color">
          <img id="productSwatch" alt="Product Swatch">
      </div>
      
      <div id="shadeValues"></div>
    </div>
  </div>

  <footer>© 2025 FoundAItion – Find your perfect foundation match 💫</footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
